AWSTemplateFormatVersion: "2010-09-09"
Description: "Finanzas Claras: API serverless autenticada con Cognito, Lambda y DynamoDB"

Resources:
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  BudgetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: budgetKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: budgetKey
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  CardsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-CardsTable"
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: cardId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: cardId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  CardsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-CardsFunction"
      RetentionInDays: 7

  CardsFunctionLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: "AWSLambdaBasicExecutionRole-8c51381a-0d3e-408c-8190-e4a51cb447b2"
      Path: /service-role/
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: logs:CreateLogGroup
            Resource: "arn:aws:logs:us-east-1:014675907640:*"
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - "arn:aws:logs:us-east-1:014675907640:log-group:/aws/lambda/Proyectoinfrainicial-CardsFunction:*"

  CardsLambdaExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: "Proyectoinfrainicial-CardsFunction-role-3luc90t9"
      Path: /service-role/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CardsFunctionLoggingPolicy
      Policies:
        - PolicyName: CardsFunctionCardsTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt CardsTable.Arn

  DemoFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-DemoFunction"
      RetentionInDays: 7

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DemoFunctionLimitedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt TransactionsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${DemoFunctionLogGroup.Arn}:*"

  DemoFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - DemoFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-DemoFunction"
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TransactionsTable
      Code: ../backend/src/transactions

  CardsFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - CardsFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-CardsFunction"
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt CardsLambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CARDS_TABLE_NAME: !Ref CardsTable
      Code: ../backend/src/cards

  TransactionsHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-TransactionsApi"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 300

  TransactionsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TransactionsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DemoFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  CardsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref TransactionsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt CardsFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000
      ConnectionType: INTERNET


  FinanceJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref TransactionsHttpApi
      Name: !Sub "${AWS::StackName}-CognitoJwtAuthorizer"
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref FinanceWebClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FinanceUserPool}"

  CreateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "POST /transactions"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${TransactionsIntegration}"

  ListTransactionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "GET /transactions"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${TransactionsIntegration}"

  GetCardsRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "GET /cards"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${CardsIntegration}"

  CreateCardRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "POST /cards"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${CardsIntegration}"

  BudgetsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TransactionsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BudgetsFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  GetBudgetsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "GET /budgets"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${BudgetsIntegration}"

  SaveBudgetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "POST /budgets"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${BudgetsIntegration}"

  TransactionsApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - CreateTransactionRoute
      - ListTransactionsRoute
      - GetBudgetsRoute
      - SaveBudgetRoute
    Properties:
      ApiId: !Ref TransactionsHttpApi
      StageName: "$default"
      AutoDeploy: true

  ApiInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DemoFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsHttpApi}/*/*/transactions"

  CardsApiInvokePermissionGet:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CardsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsHttpApi}/*/GET/cards"

  CardsApiInvokePermissionPost:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CardsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsHttpApi}/*/POST/cards"

  BudgetsLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BudgetsFunctionLimitedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt BudgetsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BudgetsFunctionLogGroup.Arn}:*"

  BudgetsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-BudgetsFunction"
      RetentionInDays: 7

  BudgetsFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - BudgetsFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-BudgetsFunction"
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt BudgetsLambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          BUDGETS_TABLE_NAME: !Ref BudgetsTable
      Code: ../backend/src/budgets

  BudgetsApiInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BudgetsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsHttpApi}/*/*/budgets"

  FinanceUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-FinanceUsers"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  FinanceWebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref FinanceUserPool
      ClientName: !Sub "${AWS::StackName}-WebClient"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

Outputs:
  TransactionsTableName:
    Description: "Nombre de la tabla DynamoDB existente en la pila"
    Value: !Ref TransactionsTable

  BudgetsTableName:
    Description: "Nombre de la tabla DynamoDB para presupuestos"
    Value: !Ref BudgetsTable

  CardsTableName:
    Description: "Nombre de la tabla DynamoDB de tarjetas"
    Value: !Ref CardsTable

  DemoFunctionName:
    Description: "Nombre de la funcion Lambda"
    Value: !Ref DemoFunction

  CardsFunctionName:
    Description: "Nombre de Lambda para consultar y guardar tarjetas"
    Value: !Ref CardsFunction

  TransactionsApiEndpoint:
    Description: "URL base del API HTTP"
    Value: !GetAtt TransactionsHttpApi.ApiEndpoint

  CreateTransactionUrl:
    Description: "Endpoint para registrar movimientos de prueba"
    Value: !Sub "${TransactionsHttpApi.ApiEndpoint}/transactions"

  ListTransactionsUrl:
    Description: "Endpoint para consultar movimientos de prueba"
    Value: !Sub "${TransactionsHttpApi.ApiEndpoint}/transactions"

  BudgetsUrl:
    Description: "Endpoint para consultar y guardar presupuestos"
    Value: !Sub "${TransactionsHttpApi.ApiEndpoint}/budgets"

  CardsUrl:
    Description: "Endpoint autenticado para consultar y guardar tarjetas"
    Value: !Sub "${TransactionsHttpApi.ApiEndpoint}/cards"

  CognitoUserPoolId:
    Description: "Identificador del User Pool para configurar React"
    Value: !Ref FinanceUserPool

  CognitoAppClientId:
    Description: "Identificador publico del cliente web de Cognito"
    Value: !Ref FinanceWebClient

  CognitoIssuerUrl:
    Description: "Emisor de tokens para el autorizador JWT de API Gateway"
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FinanceUserPool}"
