AWSTemplateFormatVersion: "2010-09-09"
Description: "Finanzas Claras: API HTTP con Lambda y DynamoDB (prototipo de demostracion)"

Resources:
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  BudgetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: budgetKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: budgetKey
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  DemoFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-DemoFunction"
      RetentionInDays: 7

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DemoFunctionLimitedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt TransactionsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${DemoFunctionLogGroup.Arn}:*"

  DemoFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - DemoFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-DemoFunction"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TransactionsTable
      Code:
        ZipFile: |
          import base64
          import json
          import logging
          import os
          import uuid
          from datetime import date, datetime, timezone
          from decimal import Decimal, InvalidOperation

          import boto3
          from boto3.dynamodb.conditions import Key

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          DEMO_USER_ID = "demo-user"


          def json_default(value):
              if isinstance(value, Decimal):
                  return str(value)
              raise TypeError(f"Tipo no serializable: {type(value).__name__}")


          def response(status_code, payload):
              return {
                  "statusCode": status_code,
                  "headers": {"Content-Type": "application/json; charset=utf-8"},
                  "body": json.dumps(payload, default=json_default, ensure_ascii=False),
              }


          def parse_body(event):
              raw = event.get("body")
              if raw is None:
                  return {}
              if event.get("isBase64Encoded"):
                  raw = base64.b64decode(raw).decode("utf-8")
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise ValueError("El cuerpo debe ser un objeto JSON.")
              return payload


          def authenticated_user_id(event):
              request_context = event.get("requestContext") or {}
              authorizer = request_context.get("authorizer") or {}
              jwt = authorizer.get("jwt") or {}
              claims = jwt.get("claims") or {}
              return str(claims.get("sub", "")).strip()


          def create_transaction(payload, user_id):
              try:
                  amount = Decimal(str(payload["amount"]))
              except (KeyError, InvalidOperation, TypeError, ValueError):
                  return response(400, {"message": "amount debe ser un numero valido."})

              if not amount.is_finite() or amount <= 0:
                  return response(400, {"message": "amount debe ser mayor que cero."})

              category = str(payload.get("category", "")).strip()
              if not category:
                  return response(400, {"message": "category es obligatorio."})

              transaction_type = str(payload.get("type", "expense")).strip().lower()
              if transaction_type not in ("expense", "income"):
                  return response(400, {"message": "type debe ser expense o income."})

              status = str(payload.get("status", "actual")).strip().lower()
              if status not in ("actual", "planned"):
                  return response(400, {"message": "status debe ser actual o planned."})

              transaction_date = str(
                  payload.get("date", datetime.now(timezone.utc).date().isoformat())
              ).strip()
              try:
                  date.fromisoformat(transaction_date)
              except ValueError:
                  return response(400, {"message": "date debe tener formato YYYY-MM-DD."})

              payment_method = str(payload.get("paymentMethod", "cash")).strip().lower()
              if payment_method not in ("cash", "debit", "credit"):
                  return response(
                      400,
                      {"message": "paymentMethod debe ser cash, debit o credit."},
                  )

              created_at = (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              )
              transaction_id = f"{created_at}#{uuid.uuid4().hex}"

              item = {
                  "userId": user_id,
                  "transactionId": transaction_id,
                  "type": transaction_type,
                  "status": status,
                  "amount": amount,
                  "category": category[:60],
                  "description": str(payload.get("description", "")).strip()[:200],
                  "date": transaction_date,
                  "paymentMethod": payment_method,
                  "createdAt": created_at,
              }

              card_id = str(payload.get("cardId", "")).strip()
              if card_id:
                  item["cardId"] = card_id

              table.put_item(Item=item)
              logger.info("Movimiento guardado: transactionId=%s", transaction_id)
              return response(
                  201,
                  {"message": "Movimiento guardado.", "transaction": item},
              )


          def list_transactions(user_id):
              result = table.query(
                  KeyConditionExpression=Key("userId").eq(user_id),
                  ScanIndexForward=False,
                  Limit=100,
              )
              return response(
                  200,
                  {
                      "count": result.get("Count", 0),
                      "transactions": result.get("Items", []),
                  },
              )


          def handler(event, context):
              try:
                  if event.get("action") == "save-demo":
                      return create_transaction(
                          {
                              "amount": "150.00",
                              "category": "comida",
                              "description": "Gasto de demostracion",
                              "type": "expense",
                              "status": "actual",
                          },
                          DEMO_USER_ID,
                      )

                  user_id = authenticated_user_id(event)
                  if not user_id:
                      return response(401, {"message": "Se requiere iniciar sesion."})

                  request_context = event.get("requestContext") or {}
                  http_context = request_context.get("http") or {}
                  method = str(http_context.get("method", "")).upper()

                  if method == "POST":
                      return create_transaction(parse_body(event), user_id)
                  if method == "GET":
                      return list_transactions(user_id)

                  return response(
                      405,
                      {"message": "Metodo no permitido. Usa GET o POST."},
                  )
              except (json.JSONDecodeError, UnicodeDecodeError, ValueError) as error:
                  return response(400, {"message": str(error)})
              except Exception:
                  logger.exception("Error procesando la solicitud")
                  return response(
                      500,
                      {"message": "Error interno. Revisa CloudWatch Logs."},
                  )

  TransactionsHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-TransactionsApi"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 300

  TransactionsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TransactionsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DemoFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000


  FinanceJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref TransactionsHttpApi
      Name: !Sub "${AWS::StackName}-CognitoJwtAuthorizer"
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref FinanceWebClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FinanceUserPool}"

  CreateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "POST /transactions"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${TransactionsIntegration}"

  ListTransactionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "GET /transactions"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${TransactionsIntegration}"

  BudgetsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TransactionsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BudgetsFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  GetBudgetsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "GET /budgets"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${BudgetsIntegration}"

  SaveBudgetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TransactionsHttpApi
      RouteKey: "POST /budgets"
      AuthorizationType: JWT
      AuthorizerId: !Ref FinanceJwtAuthorizer
      Target: !Sub "integrations/${BudgetsIntegration}"

  TransactionsApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - CreateTransactionRoute
      - ListTransactionsRoute
      - GetBudgetsRoute
      - SaveBudgetRoute
    Properties:
      ApiId: !Ref TransactionsHttpApi
      StageName: "$default"
      AutoDeploy: true

  ApiInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DemoFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsHttpApi}/*/*/transactions"

  BudgetsLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BudgetsFunctionLimitedAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt BudgetsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BudgetsFunctionLogGroup.Arn}:*"

  BudgetsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-BudgetsFunction"
      RetentionInDays: 7

  BudgetsFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - BudgetsFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-BudgetsFunction"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BudgetsLambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          BUDGETS_TABLE_NAME: !Ref BudgetsTable
      Code:
        ZipFile: |
          import base64
          import json
          import logging
          import os
          import re
          from datetime import datetime, timezone
          from decimal import Decimal, InvalidOperation

          import boto3
          from boto3.dynamodb.conditions import Key

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          table = boto3.resource("dynamodb").Table(os.environ["BUDGETS_TABLE_NAME"])
          ALLOWED_CATEGORIES = {
              "comida",
              "vivienda",
              "transporte",
              "servicios",
              "salud",
              "escuela",
              "ropa",
              "entretenimiento",
              "ahorro",
              "otros",
          }


          def json_default(value):
              if isinstance(value, Decimal):
                  return str(value)
              raise TypeError(f"Tipo no serializable: {type(value).__name__}")


          def response(status_code, payload):
              return {
                  "statusCode": status_code,
                  "headers": {"Content-Type": "application/json; charset=utf-8"},
                  "body": json.dumps(payload, default=json_default, ensure_ascii=False),
              }


          def authenticated_user_id(event):
              request_context = event.get("requestContext") or {}
              authorizer = request_context.get("authorizer") or {}
              jwt = authorizer.get("jwt") or {}
              claims = jwt.get("claims") or {}
              return str(claims.get("sub", "")).strip()


          def parse_body(event):
              raw = event.get("body")
              if raw is None:
                  return {}
              if event.get("isBase64Encoded"):
                  raw = base64.b64decode(raw).decode("utf-8")
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise ValueError("El cuerpo debe ser un objeto JSON.")
              return payload


          def validate_month(value):
              month = str(value or "").strip()
              if not re.fullmatch(r"\d{4}-(0[1-9]|1[0-2])", month):
                  raise ValueError("month debe tener formato YYYY-MM.")
              try:
                  datetime.strptime(month, "%Y-%m")
              except ValueError as error:
                  raise ValueError("month debe tener formato YYYY-MM.") from error
              return month


          def list_budgets(user_id, month):
              key_condition = Key("userId").eq(user_id)
              if month:
                  key_condition = key_condition & Key("budgetKey").begins_with(f"{month}#")

              result = table.query(
                  KeyConditionExpression=key_condition,
                  ScanIndexForward=False,
                  Limit=100,
              )
              budgets = result.get("Items", [])
              return response(200, {"count": len(budgets), "budgets": budgets})


          def save_budget(payload, user_id):
              month = validate_month(payload.get("month"))
              category = str(payload.get("category", "")).strip().lower()
              if category not in ALLOWED_CATEGORIES:
                  return response(400, {"message": "category no es una categoría válida."})

              try:
                  limit_amount = Decimal(str(payload["limitAmount"]))
              except (KeyError, InvalidOperation, TypeError, ValueError):
                  return response(400, {"message": "limitAmount debe ser un número válido."})

              if not limit_amount.is_finite() or limit_amount <= 0:
                  return response(400, {"message": "limitAmount debe ser mayor que cero."})

              updated_at = (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              )
              item = {
                  "userId": user_id,
                  "budgetKey": f"{month}#{category}",
                  "month": month,
                  "category": category,
                  "limitAmount": limit_amount,
                  "updatedAt": updated_at,
              }
              table.put_item(Item=item)
              logger.info("Presupuesto guardado: month=%s category=%s", month, category)
              return response(201, {"message": "Presupuesto guardado.", "budget": item})


          def handler(event, context):
              try:
                  user_id = authenticated_user_id(event)
                  if not user_id:
                      return response(401, {"message": "Se requiere iniciar sesión."})

                  request_context = event.get("requestContext") or {}
                  http_context = request_context.get("http") or {}
                  method = str(http_context.get("method", "")).upper()

                  if method == "GET":
                      query = event.get("queryStringParameters") or {}
                      month_value = query.get("month")
                      month = validate_month(month_value) if month_value else ""
                      return list_budgets(user_id, month)
                  if method == "POST":
                      return save_budget(parse_body(event), user_id)

                  return response(405, {"message": "Método no permitido. Usa GET o POST."})
              except (json.JSONDecodeError, UnicodeDecodeError, ValueError) as error:
                  return response(400, {"message": str(error)})
              except Exception:
                  logger.exception("Error procesando el presupuesto")
                  return response(500, {"message": "Error interno. Revisa CloudWatch Logs."})

  BudgetsApiInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BudgetsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsHttpApi}/*/*/budgets"

  FinanceUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-FinanceUsers"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  FinanceWebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref FinanceUserPool
      ClientName: !Sub "${AWS::StackName}-WebClient"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

Outputs:
  TransactionsTableName:
    Description: "Nombre de la tabla DynamoDB existente en la pila"
    Value: !Ref TransactionsTable

  BudgetsTableName:
    Description: "Nombre de la tabla DynamoDB para presupuestos"
    Value: !Ref BudgetsTable

  DemoFunctionName:
    Description: "Nombre de la funcion Lambda"
    Value: !Ref DemoFunction

  TransactionsApiEndpoint:
    Description: "URL base del API HTTP"
    Value: !GetAtt TransactionsHttpApi.ApiEndpoint

  CreateTransactionUrl:
    Description: "Endpoint para registrar movimientos de prueba"
    Value: !Sub "${TransactionsHttpApi.ApiEndpoint}/transactions"

  ListTransactionsUrl:
    Description: "Endpoint para consultar movimientos de prueba"
    Value: !Sub "${TransactionsHttpApi.ApiEndpoint}/transactions"

  BudgetsUrl:
    Description: "Endpoint para consultar y guardar presupuestos"
    Value: !Sub "${TransactionsHttpApi.ApiEndpoint}/budgets"

  CognitoUserPoolId:
    Description: "Identificador del User Pool para configurar React"
    Value: !Ref FinanceUserPool

  CognitoAppClientId:
    Description: "Identificador publico del cliente web de Cognito"
    Value: !Ref FinanceWebClient

  CognitoIssuerUrl:
    Description: "Emisor de tokens para el autorizador JWT de API Gateway"
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FinanceUserPool}"
